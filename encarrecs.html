<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can Rostit - Encàrrecs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <script src="encarrecs.js" defer></script>
</head>

<body>
    <!-- Capçalera -->
    <header>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Plats</a></li>
                <li><a href="encarrecs.html">Encàrrecs</a></li>
                <li><a href="menus.html">Menú</a></li>
                <li><a href="index.html#contacte">Contacte</a></li>
            </ul>
        </nav>
        <h1>can rostit</h1>
        <h3>Cuina casolana</h3>
        <p class="sub">Fes el teu encàrrec online i recull-ho a la nostra botiga sense cues.</p>
    </header>
    <main id="encarrecs">
        <main>
            <section class="pas">
                <div class="pas-num">
                    <span>1</span>
                    <h2>Realitza el teu encàrrec</h2>
                </div>

                <div class="fila">
                    <div class="camp">
                        <label class="lbl" for="dia">Per quan?</label>
                        <input type="date" id="dia">
                    </div>

                    <div class="camp">
                        <label class="lbl" for="hora">Seleccionar hora</label>
                        <input type="time" id="hora">
                    </div>

                    <div class="camp">
                        <label class="lbl" for="notes">Escriu el que vols encarregar</label>
                        <textarea id="notes" placeholder="Ex: Paella de marisc, truita de patates..."></textarea>
                    </div>
            </section>

            <!-- El JavaScript omplirà aquest div automàticament -->
            <div id="llista-menus"></div>
        </main>

</body>

</html>
